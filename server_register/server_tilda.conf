server {
    listen 80;
    server_name test-register-tilda.cubinez.ru;

    # Логи для отладки
    access_log /var/log/nginx/server_tilda_access.log;
    error_log /var/log/nginx/server_tilda_error.log;

    client_max_body_size 10M;

    location / {
        proxy_pass http://unix:/var/www/server_tilda/ipc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Важные настройки для socket
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://unix:/var/www/server_tilda/ipc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        
        # Важные настройки для socket
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Опционально: обработка статических файлов если будут
    location /static/ {
        alias /var/www/server_tilda/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
